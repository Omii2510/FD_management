<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>FD Connect</title>
    <style>
      :root{--bg:#f2f5f4;--surf:#fff;--ink:#14232b;--mut:#5b6b72;--line:#d8e0e0;--pri:#0e6b55;--pri-ink:#fff;--gold:#8a6410;--warn:#b3402a;color-scheme:light;box-sizing:border-box}
      @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a1d;--surf:#17262a;--ink:#e8f0ee;--mut:#9ab0ad;--line:#27393d;--pri:#3fbf9b;--pri-ink:#06231b;--gold:#e0b44a;--warn:#ef8a74;color-scheme:dark}}
      :root[data-theme=dark]{--bg:#0f1a1d;--surf:#17262a;--ink:#e8f0ee;--mut:#9ab0ad;--line:#27393d;--pri:#3fbf9b;--pri-ink:#06231b;--gold:#e0b44a;--warn:#ef8a74;color-scheme:dark}
      *,*::before,*::after{box-sizing:inherit}
      body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      button,input,select,textarea{font:inherit;color:inherit}
      :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
      .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
      .brand{font-weight:800;font-size:1.15rem;letter-spacing:-.02em}.brand small{display:block;font-weight:500;color:var(--mut);font-size:.75rem;letter-spacing:0}
      nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--surf);border-bottom:1px solid var(--line)}
      nav button{white-space:nowrap;border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--mut);font-weight:600}
      nav button[aria-current=true]{background:var(--pri);color:var(--pri-ink)}
      main{max-width:1000px;margin:0 auto;padding:18px}
      h1{font-size:1.6rem;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}h2{font-size:1.2rem;margin:14px 0 10px;letter-spacing:-.01em}h3{font-size:1.02rem;margin:0 0 4px}
      p{margin:6px 0}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
      .card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px}.rate{font-size:1.8rem;font-weight:800;color:var(--pri);line-height:1.2}.mut{color:var(--mut);font-size:.88rem}
      .btn{border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}
      .btn.ghost{background:none;color:var(--pri)}.btn.bad{background:none;border-color:var(--warn);color:var(--warn)}.btn:disabled{opacity:.5;cursor:not-allowed}
      .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.stack{display:grid;gap:10px}form.stack{max-width:600px}
      label{display:grid;gap:4px;font-weight:600;font-size:.88rem}
      input,select,textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}textarea{resize:vertical}
      .two{display:grid;gap:10px;grid-template-columns:1fr 1fr}.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.76rem;font-weight:700;border:1px solid var(--line)}
      .tag.ok{color:var(--pri);border-color:var(--pri)}.tag.no{color:var(--warn);border-color:var(--warn)}.tag.wait{color:var(--gold);border-color:var(--gold)}
      .notice,.error{padding:10px 12px;border-radius:8px;font-size:.9rem}.notice{color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--surf))}.error{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surf))}
      .empty{padding:24px 12px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:10px}
      .auth{max-width:460px;margin:6vh auto;padding:0 16px}.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0}
      .seg button{flex:1;border:0;background:var(--surf);padding:10px;cursor:pointer;font-weight:700;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--pri);color:var(--pri-ink)}
      .check{display:flex;grid-template-columns:auto 1fr;align-items:flex-start;gap:9px;font-weight:500;line-height:1.45}.check input{width:17px;margin:3px 0 0}
      .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.toolbar button[aria-current=true]{color:var(--pri);border-color:var(--pri)}
      .metric{display:grid;gap:5px}.metric strong{font-size:1.5rem;color:var(--pri)}
      .ad{border:1px solid var(--gold);background:var(--surf);border-radius:10px;padding:12px 14px;margin-bottom:12px}
      .ad img{width:100%;max-height:160px;object-fit:cover;border-radius:7px;margin-bottom:8px}
      .form-grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
      .file-hint{font-size:.8rem;color:var(--mut)}.user-ref{font-size:.78rem;color:var(--mut)}
      @media(max-width:600px){.two,.form-grid{grid-template-columns:1fr}main{padding:14px}.auth{margin:3vh auto}.top{padding:10px 12px}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
    <script type="module" src="/fd-connect.js"></script>
  </body>
</html>
